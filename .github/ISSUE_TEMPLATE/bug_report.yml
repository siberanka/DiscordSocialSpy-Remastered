name: Bug report
description: Report a reproducible plugin defect.
title: "[Bug]: "
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: Never paste a live Discord webhook or unredacted private-message content.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Paper/Folia build
      placeholder: "Paper 26.1.2 build 74"
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: "25.0.3"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs and configuration
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed webhook URLs, tokens, and private player content.
          required: true
        - label: I tested the latest supported plugin release.
          required: true
