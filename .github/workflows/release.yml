name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  modern-api:
    name: Verify Paper 26.1.x API
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build and test
        run: ./gradlew clean build -PapiLine=modern

  release:
    needs: modern-api
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build release artifact
        run: ./gradlew clean build
      - name: Verify release version
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts)"
          test "$expected" = "$actual"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jar="$(find build/libs -maxdepth 1 -name 'DiscordSocialSpy-*.jar' ! -name '*-sources.jar' -print -quit)"
          gh release create "$GITHUB_REF_NAME" "$jar" \
            --verify-tag \
            --title "DiscordSocialSpy ${GITHUB_REF_NAME#v}" \
            --generate-notes
